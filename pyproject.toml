[tool.poetry]
name = "tympany"
version = "0.3.0"
description = "Create and analyze Corti BeWER STT benchmark reports — classify reference/generated differences by type and clinical risk."
authors = ["Corti <help@corti.ai>"]
readme = "README.md"
license = "Proprietary"
# Safeguard: rejected by public package indexes. Remove deliberately if you
# ever decide to publish Tympany outside GitHub source distribution.
classifiers = ["Private :: Do Not Upload"]
packages = [
    { include = "tympany" },
    { include = "web" },
]
# Ship the web assets; never ship persisted (potentially PHI) data.
include = ["LICENSE", "web/templates/**/*", "web/static/**/*"]
exclude = ["web/data/**/*"]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"  # upper bound required by bewer (requires <3.15)
rapidfuzz = ">=3.0"
fastapi = ">=0.111"
uvicorn = { extras = ["standard"], version = ">=0.29" }
httpx = ">=0.27"
python-multipart = ">=0.0.9"
itsdangerous = ">=2.2"
jinja2 = ">=3.1"
python-dotenv = ">=1.0"
bewer = ">=0.1.0a17,<0.2.0"
num2words = "^0.5.14"
platformdirs = ">=4"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[tool.poetry.scripts]
tympany = "tympany.cli:main"              # GitHub/uvx launcher
tympany-serve = "web.serve:main"          # run the web server

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
