{% extends "base.html" %}
{% block title %}Tympany — Sign in{% endblock %}
{% block nav %}{% endblock %}

{% block body %}
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .login-wrap {
    width: 360px;
    padding: 40px 0;
    text-align: center;
  }
  .login-brand {
    margin-bottom: 8px;
    color: hsl(var(--foreground));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-brand-logo {
    height: 40px;
    width: auto;
    display: block;
  }
  .login-sub {
    font-size: 13px;
    color: hsl(var(--muted-foreground));
    margin-bottom: 32px;
  }
  .login-card {
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border));
    border-radius: var(--radius);
    padding: 28px 24px;
  }
  .login-input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 12px;
    box-sizing: border-box;
    background: hsl(var(--background));
    border: 1px solid hsl(var(--border));
    border-radius: var(--radius);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: hsl(var(--foreground));
  }
  .login-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 10px 16px;
    background: hsl(var(--foreground));
    border: 1px solid hsl(var(--border));
    border-radius: var(--radius);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: hsl(var(--background));
    cursor: pointer;
    transition: opacity .15s;
  }
  .login-btn:hover { opacity: .85; }
  .login-notice {
    margin-top: 16px;
    font-size: 11px;
    color: hsl(var(--muted-foreground));
  }
  .theme-toggle-login {
    position: fixed;
    top: 16px;
    right: 16px;
    background: none;
    border: 1px solid hsl(var(--border));
    border-radius: var(--radius);
    padding: 5px 7px;
    cursor: pointer;
    color: hsl(var(--muted-foreground));
    display: flex;
    align-items: center;
  }
  .theme-toggle-login:hover { color: hsl(var(--foreground)); background: hsl(var(--accent)); }
</style>

<button class="theme-toggle-login" onclick="toggleTheme()" aria-label="Toggle dark mode">
  <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
  <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

  </div>
  <div class="login-brand">
    <h2>Tympany</h2>
  </div>
  <div class="login-sub">STT error analysis tool</div>

  <div class="login-card">
    {% if error == 'invalid_email' %}
      <div class="error-box" style="margin-bottom:16px;">Please enter a valid email address.</div>
    {% endif %}

    <form method="post" action="/login">
      <input class="login-input" type="email" name="email" placeholder="you@example.com"
             autocomplete="email" autofocus required>
      <button type="submit" class="login-btn">Continue</button>
    </form>
    <div class="login-notice">Your email scopes your analysis history.</div>
  </div>
</div>
{% endblock %}
